name: dast-juice-shop
on:
  workflow_dispatch:

jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - name: Start Juice Shop
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 >/dev/null && break
            sleep 2
          done
          echo "HOST_IP=$(hostname -I | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Run Checkmarx DAST
        env:
          CX_APIKEY: ${{ secrets.CX_APIKEY }}
        run: |
          mkdir -p output
          docker run --rm --user=root \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e CX_APIKEY \
            -v "$PWD/output:/output" \
            checkmarx/dast:latest scan \
              --base-url "${{ secrets.CX_BASE_URL }}" \
              --is-cloud-scan=true \
              --one-time-tunnel=true \
              --env-setup="{\"name\":\"juice-shop-private\",\"url\":\"http://${HOST_IP}:3000\",\"scanType\":\"web\",\"isPublic\":false,\"hasAuth\":false}" \
              --output /output --verbose

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-output
          path: output/
